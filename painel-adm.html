<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin — K'Delícia</title>
    <link rel="shortcut icon" href="img/logo.png" type="image/x-icon">
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Lato:wght@400;700;900&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --vinho: #6b1515;
            --vinho2: #7a2635;
            --vinho3: #4a0d10;
            --dourado: #f1c875;
            --fundo: #d9ad73;
            --fundo2: #e2bb84;
            --texto: #2d160f;
            --branco: #fff;
            --glass: rgba(255, 255, 255, 0.22);
            --glass2: rgba(255, 255, 255, 0.10);
            --shadow: 0 18px 48px rgba(41, 7, 9, 0.22);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Lato', Arial, sans-serif;
            background: linear-gradient(135deg, #c99b5a 0%, #d9ad73 50%, #e2bb84 100%);
            min-height: 100vh;
            color: var(--texto);
        }

        /* ── Header ── */
        .header {
            background: linear-gradient(135deg, var(--vinho3), var(--vinho));
            padding: 18px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            font-family: 'Cinzel', serif;
            color: var(--dourado);
            font-size: clamp(18px, 2.5vw, 28px);
            letter-spacing: .14em;
        }

        .header span {
            color: rgba(255, 255, 255, 0.65);
            font-size: 13px;
        }

        /* ── Layout ── */
        .main {
            width: min(1200px, calc(100% - 32px));
            margin: 32px auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
        }

        .card-full {
            grid-column: 1 / -1;
        }

        /* ── Cards ── */
        .card {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.30), rgba(255, 255, 255, 0.12));
            border: 1px solid rgba(255, 255, 255, 0.50);
            border-radius: 22px;
            padding: 28px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .card-titulo {
            font-family: 'Cinzel', serif;
            color: var(--vinho2);
            font-size: 16px;
            letter-spacing: .12em;
            text-transform: uppercase;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid rgba(107, 21, 21, 0.18);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* ── Botão principal ── */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, var(--vinho), var(--vinho2));
            color: #f5e6d0;
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 12px;
            padding: 12px 22px;
            font-family: 'Lato', Arial, sans-serif;
            font-size: 14px;
            font-weight: 900;
            letter-spacing: .07em;
            cursor: pointer;
            transition: .22s ease;
            box-shadow: 0 8px 22px rgba(78, 13, 18, 0.22);
        }

        .btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .btn:disabled {
            opacity: .55;
            cursor: not-allowed;
            transform: none;
        }

        .btn-danger {
            background: linear-gradient(135deg, #8b1a1a, #a02020);
            padding: 7px 14px;
            font-size: 12px;
        }

        .btn-success {
            background: linear-gradient(135deg, #1a6b2a, #22882f);
        }

        .btn-sm {
            padding: 7px 14px;
            font-size: 12px;
            border-radius: 9px;
        }

        /* ── Inputs ── */
        input,
        select {
            width: 100%;
            padding: 11px 14px;
            border-radius: 11px;
            border: 1px solid rgba(107, 21, 21, 0.22);
            background: rgba(255, 255, 255, 0.75);
            font-size: 14px;
            color: var(--texto);
            font-family: 'Lato', Arial, sans-serif;
            outline: none;
            transition: .2s;
        }

        input:focus,
        select:focus {
            border-color: var(--vinho);
            box-shadow: 0 0 0 3px rgba(107, 21, 21, 0.12);
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 900;
            color: var(--vinho2);
            letter-spacing: .07em;
            text-transform: uppercase;
            margin: 12px 0 5px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 10px;
            align-items: end;
        }

        /* ── Tabela de clientes ── */
        .tabela {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 14px;
        }

        .tabela th {
            background: rgba(107, 21, 21, 0.85);
            color: #f5e6d0;
            padding: 11px 14px;
            text-align: left;
            font-size: 12px;
            letter-spacing: .09em;
            text-transform: uppercase;
        }

        .tabela th:first-child {
            border-radius: 10px 0 0 0;
        }

        .tabela th:last-child {
            border-radius: 0 10px 0 0;
        }

        .tabela td {
            background: rgba(255, 255, 255, 0.32);
            padding: 11px 14px;
            border-bottom: 1px solid rgba(107, 21, 21, 0.08);
        }

        .tabela tr:last-child td {
            border-bottom: 0;
        }

        .tabela tr:hover td {
            background: rgba(255, 255, 255, 0.50);
        }

        .badge-ativo {
            display: inline-block;
            background: #1a6b2a;
            color: #c8f5d0;
            border-radius: 999px;
            padding: 3px 10px;
            font-size: 11px;
            font-weight: 900;
        }

        .badge-inativo {
            display: inline-block;
            background: #8b1a1a;
            color: #f5c8c8;
            border-radius: 999px;
            padding: 3px 10px;
            font-size: 11px;
            font-weight: 900;
        }

        /* ── Cardápio ── */
        .dia-card {
            background: rgba(255, 255, 255, 0.28);
            border: 1px solid rgba(255, 255, 255, 0.45);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .dia-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .dia-nome {
            font-weight: 900;
            color: var(--vinho2);
            font-size: 15px;
        }

        .carne-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(107, 21, 21, 0.12);
            color: var(--vinho2);
            border-radius: 8px;
            padding: 5px 12px;
            font-size: 13px;
            font-weight: 700;
            margin: 3px;
        }

        .carne-tag button {
            background: none;
            border: none;
            color: var(--vinho);
            cursor: pointer;
            font-size: 15px;
            line-height: 1;
            padding: 0;
        }

        .nova-carne-row {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .nova-carne-row input {
            width: auto;
            flex: 1;
        }

        /* ── Disparo ── */
        .disparo-box {
            text-align: center;
            padding: 10px 0;
        }

        .disparo-status {
            margin-top: 18px;
            padding: 16px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            display: none;
        }

        .disparo-status.ok {
            background: rgba(26, 107, 42, 0.18);
            color: #1a5c25;
            border: 1px solid rgba(26, 107, 42, 0.3);
        }

        .disparo-status.erro {
            background: rgba(139, 26, 26, 0.18);
            color: #6b1515;
            border: 1px solid rgba(139, 26, 26, 0.3);
        }

        .disparo-status.show {
            display: block;
        }

        /* ── Logs ── */
        .log-item {
            display: grid;
            grid-template-columns: auto 1fr auto auto;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.28);
            border-radius: 10px;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .log-dot-ok {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #22882f;
            flex-shrink: 0;
        }

        .log-dot-erro {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #a02020;
            flex-shrink: 0;
        }

        .log-hora {
            color: #7a5a45;
            font-size: 12px;
            white-space: nowrap;
        }

        /* ── Stats ── */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin-bottom: 22px;
        }

        .stat-box {
            background: rgba(107, 21, 21, 0.85);
            color: #f5e6d0;
            border-radius: 14px;
            padding: 18px;
            text-align: center;
        }

        .stat-num {
            font-family: 'Cinzel', serif;
            font-size: 32px;
            font-weight: 900;
            color: var(--dourado);
        }

        .stat-label {
            font-size: 12px;
            opacity: .85;
            margin-top: 4px;
            letter-spacing: .06em;
        }

        /* ── Toast ── */
        #toast {
            position: fixed;
            bottom: 28px;
            right: 28px;
            background: var(--vinho);
            color: #f5e6d0;
            padding: 14px 22px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transform: translateY(80px);
            opacity: 0;
            transition: .35s ease;
            z-index: 999;
        }

        #toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        /* ── Spinner ── */
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .7s linear infinite;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 760px) {
            .main {
                grid-template-columns: 1fr;
            }

            .card-full {
                grid-column: 1;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>

<body>

    <header class="header">
        <h1>K'Delícia — Painel Admin</h1>
        <span id="horario-atual"></span>
    </header>

    <div class="main">

        <!-- ── STATS ── -->
        <div class="card card-full">
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-num" id="stat-clientes">—</div>
                    <div class="stat-label">Clientes Ativos</div>
                </div>
                <div class="stat-box">
                    <div class="stat-num" id="stat-enviados">—</div>
                    <div class="stat-label">Disparos Hoje</div>
                </div>
                <div class="stat-box">
                    <div class="stat-num" id="stat-dia">—</div>
                    <div class="stat-label">Carnes Hoje</div>
                </div>
            </div>

            <!-- DISPARO MANUAL -->
            <div class="disparo-box">
                <p style="color:#4a2a1a;margin-bottom:16px;font-size:15px;">
                    Disparo automático: <strong>todo dia às 10h</strong> (seg–sáb)<br>
                    Ou clique abaixo para disparar agora manualmente:
                </p>
                <button class="btn" id="btn-disparar" onclick="disparar()">
                    📤 Disparar Mensagem Agora
                </button>
                <div class="disparo-status" id="disparo-status"></div>
            </div>
        </div>

        <!-- ── CLIENTES ── -->
        <div class="card card-full">
            <div class="card-titulo">👥 Clientes</div>

            <div class="form-row">
                <div>
                    <label>Nome</label>
                    <input type="text" id="inp-nome" placeholder="Ex: João Marmitex">
                </div>
                <div>
                    <label>Telefone (com DDD)</label>
                    <input type="text" id="inp-tel" placeholder="(41) 99999-9999">
                </div>
                <div style="padding-top:17px;">
                    <button class="btn btn-sm" onclick="adicionarCliente()">+ Adicionar</button>
                </div>
            </div>

            <div style="margin-top:20px;overflow-x:auto;">
                <table class="tabela">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Nome</th>
                            <th>Telefone</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-clientes">
                        <tr>
                            <td colspan="5" style="text-align:center;padding:20px;">Carregando...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- ── CARDÁPIO ── -->
        <div class="card card-full">
            <div class="card-titulo">🗓️ Cardápio Semanal</div>
            <div id="cardapio-container">
                <div style="text-align:center;padding:20px;">Carregando...</div>
            </div>
        </div>

        <!-- ── LOGS ── -->
        <div class="card card-full">
            <div class="card-titulo" style="justify-content:space-between;">
                <span>📋 Últimos Disparos</span>
                <button class="btn btn-sm" onclick="carregarLogs()">↺ Atualizar</button>
            </div>
            <div id="logs-container">
                <div style="text-align:center;padding:20px;">Carregando...</div>
            </div>
        </div>

    </div>

    <!-- Toast -->
    <div id="toast"></div>

    <script>
        // ── Configuração ─────────────────────────────────────────
        // Altere para o endereço do seu servidor Node quando subir em produção
        const API = 'http://localhost:3000/api';

        const DIAS = ['Domingo', 'Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado'];

        // ── Relógio ──────────────────────────────────────────────
        function atualizarHorario() {
            document.getElementById('horario-atual').textContent =
                new Date().toLocaleString('pt-BR', { dateStyle: 'full', timeStyle: 'short' });
        }
        atualizarHorario();
        setInterval(atualizarHorario, 1000);

        // ── Toast ────────────────────────────────────────────────
        function toast(msg, dur = 3000) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), dur);
        }

        // ── Carregar tudo ────────────────────────────────────────
        async function init() {
            await Promise.all([carregarClientes(), carregarCardapio(), carregarLogs()]);
        }

        // ── CLIENTES ─────────────────────────────────────────────
        async function carregarClientes() {
            try {
                const res = await fetch(`${API}/clientes`);
                const data = await res.json();
                const tbody = document.getElementById('tabela-clientes');
                const ativos = data.filter(c => c.ativo).length;
                document.getElementById('stat-clientes').textContent = ativos;

                if (!data.length) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:20px;">Nenhum cliente cadastrado</td></tr>';
                    return;
                }

                tbody.innerHTML = data.map(c => `
        <tr>
          <td>${c.id_cliente}</td>
          <td><strong>${c.nome}</strong></td>
          <td>${formatarTel(c.telefone)}</td>
          <td><span class="${c.ativo ? 'badge-ativo' : 'badge-inativo'}">${c.ativo ? 'Ativo' : 'Inativo'}</span></td>
          <td style="display:flex;gap:6px;flex-wrap:wrap;">
            <button class="btn btn-sm ${c.ativo ? 'btn-danger' : 'btn-success'}"
              onclick="toggleCliente(${c.id_cliente}, ${!c.ativo})">
              ${c.ativo ? '⏸ Pausar' : '▶ Ativar'}
            </button>
            <button class="btn btn-danger btn-sm" onclick="removerCliente(${c.id_cliente}, '${c.nome}')">🗑</button>
          </td>
        </tr>
      `).join('');
            } catch (e) {
                toast('Erro ao carregar clientes. Servidor offline?');
            }
        }

        async function adicionarCliente() {
            const nome = document.getElementById('inp-nome').value.trim();
            const tel = document.getElementById('inp-tel').value.trim();
            if (!nome || !tel) return toast('Preencha nome e telefone!');

            const res = await fetch(`${API}/clientes`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nome, telefone: tel })
            });

            if (res.ok) {
                document.getElementById('inp-nome').value = '';
                document.getElementById('inp-tel').value = '';
                toast(`✅ ${nome} adicionado!`);
                carregarClientes();
            } else {
                const err = await res.json();
                toast('Erro: ' + (err.error || 'tente novamente'));
            }
        }

        async function toggleCliente(id, ativo) {
            await fetch(`${API}/clientes/${id}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ativo })
            });
            carregarClientes();
        }

        async function removerCliente(id, nome) {
            if (!confirm(`Remover ${nome}?`)) return;
            await fetch(`${API}/clientes/${id}`, { method: 'DELETE' });
            toast(`🗑 ${nome} removido`);
            carregarClientes();
        }

        // ── CARDÁPIO ─────────────────────────────────────────────
        let cardapioDados = {};

        async function carregarCardapio() {
            try {
                const res = await fetch(`${API}/cardapio`);
                const data = await res.json();
                const hoje = new Date().getDay();

                // Conta carnes de hoje para o stat
                const hoje_card = data.find(d => d.dia_semana === hoje);
                document.getElementById('stat-dia').textContent =
                    hoje_card ? hoje_card.carnes.length : '0';

                // Monta estrutura local
                cardapioDados = {};
                data.forEach(d => { cardapioDados[d.dia_semana] = [...d.carnes]; });

                renderCardapio();
            } catch (e) {
                toast('Erro ao carregar cardápio');
            }
        }

        function renderCardapio() {
            const hoje = new Date().getDay();
            const container = document.getElementById('cardapio-container');

            container.innerHTML = [1, 2, 3, 4, 5, 6].map(dia => {
                const carnes = cardapioDados[dia] || [];
                const isHoje = dia === hoje;

                return `
        <div class="dia-card" style="${isHoje ? 'border-color:rgba(107,21,21,0.5);box-shadow:0 0 0 2px rgba(107,21,21,0.18)' : ''}">
          <div class="dia-header">
            <span class="dia-nome">${isHoje ? '📍 ' : ''}${DIAS[dia]}</span>
            <button class="btn btn-sm" onclick="salvarDia(${dia})">💾 Salvar</button>
          </div>
          <div id="carnes-${dia}">
            ${carnes.map((c, i) => `
              <span class="carne-tag">
                🥩 ${c}
                <button onclick="removerCarne(${dia}, ${i})" title="Remover">×</button>
              </span>
            `).join('')}
            ${carnes.length === 0 ? '<em style="color:#7a5a45;font-size:13px;">Nenhuma carne cadastrada</em>' : ''}
          </div>
          <div class="nova-carne-row">
            <input type="text" id="nova-carne-${dia}" placeholder="Nome da carne...">
            <button class="btn btn-sm" onclick="adicionarCarne(${dia})">+ Carne</button>
          </div>
        </div>
      `;
            }).join('');
        }

        function adicionarCarne(dia) {
            const inp = document.getElementById(`nova-carne-${dia}`);
            const val = inp.value.trim();
            if (!val) return;
            if (!cardapioDados[dia]) cardapioDados[dia] = [];
            cardapioDados[dia].push(val);
            inp.value = '';
            renderCardapio();
        }

        function removerCarne(dia, idx) {
            cardapioDados[dia].splice(idx, 1);
            renderCardapio();
        }

        async function salvarDia(dia) {
            const carnes = cardapioDados[dia] || [];
            if (!carnes.length) return toast('Adicione ao menos uma carne!');

            const res = await fetch(`${API}/cardapio/${dia}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ carnes })
            });

            if (res.ok) {
                toast(`✅ ${DIAS[dia]} salvo!`);
                carregarCardapio();
            } else {
                toast('Erro ao salvar');
            }
        }

        // ── DISPARO ──────────────────────────────────────────────
        async function disparar() {
            const btn = document.getElementById('btn-disparar');
            const status = document.getElementById('disparo-status');

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Disparando...';
            status.className = 'disparo-status';

            try {
                const res = await fetch(`${API}/disparar`, { method: 'POST' });
                const data = await res.json();

                if (data.ok) {
                    status.className = 'disparo-status ok show';
                    status.innerHTML = `✅ Disparo concluído! <strong>${data.enviados}/${data.total}</strong> mensagens enviadas com sucesso.`;
                    toast('✅ Mensagens enviadas!');
                } else {
                    status.className = 'disparo-status erro show';
                    status.innerHTML = `❌ ${data.motivo === 'domingo' ? 'Hoje é domingo — loja fechada!' : 'Erro no disparo: ' + (data.erro || data.motivo)}`;
                }

                carregarLogs();
                carregarClientes();
            } catch (e) {
                status.className = 'disparo-status erro show';
                status.innerHTML = '❌ Servidor offline. Verifique se o disparador.js está rodando.';
            }

            btn.disabled = false;
            btn.innerHTML = '📤 Disparar Mensagem Agora';
        }

        // ── LOGS ─────────────────────────────────────────────────
        async function carregarLogs() {
            try {
                const res = await fetch(`${API}/logs`);
                const data = await res.json();

                const hoje = new Date().toDateString();
                const disparosHoje = data.filter(l =>
                    new Date(l.disparado_em).toDateString() === hoje && l.status === 'enviado'
                ).length;
                document.getElementById('stat-enviados').textContent = disparosHoje;

                const el = document.getElementById('logs-container');
                if (!data.length) { el.innerHTML = '<p style="text-align:center;padding:16px;color:#7a5a45;">Nenhum disparo registrado ainda</p>'; return; }

                el.innerHTML = data.slice(0, 20).map(l => `
        <div class="log-item">
          <span class="${l.status === 'enviado' ? 'log-dot-ok' : 'log-dot-erro'}"></span>
          <span><strong>${l.clientes?.nome || l.telefone}</strong> ${l.status === 'erro' ? '— ' + (l.erro || 'erro') : ''}</span>
          <span style="font-size:12px;background:rgba(107,21,21,0.1);padding:3px 8px;border-radius:6px;">${l.status}</span>
          <span class="log-hora">${new Date(l.disparado_em).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' })}</span>
        </div>
      `).join('');
            } catch (e) {
                document.getElementById('logs-container').innerHTML = '<p style="text-align:center;padding:16px;color:#7a5a45;">Servidor offline</p>';
            }
        }

        // ── Helpers ──────────────────────────────────────────────
        function formatarTel(tel) {
            // 5541999999999 → (41) 99999-9999
            const t = tel.replace(/\D/g, '').replace(/^55/, '');
            return t.replace(/(\d{2})(\d{4,5})(\d{4})/, '($1) $2-$3');
        }

        // ── Init ─────────────────────────────────────────────────
        init();
    </script>
</body>

</html>
